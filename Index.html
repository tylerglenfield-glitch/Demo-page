<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Intro to Web Development</title>
  <style>
    /* Styles for the entire page background and overall page layout */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333333;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }

    /* Styles for the main heading */
    h1 {
      color: #1a365d;
      text-align: center;
      border-bottom: 3px solid #3182ce;
      padding-bottom: 10px;

    /* Styles for the paragraph content box */
    p {
      background-color: #ffffff;
      font-size: 18px;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>Welcome to Web Development 101</h1>
  <p>In this class, we learn the foundations of building, styling, and publishing interactive websites on the web using HTML, CSS, and GitHub Pages.</p>
